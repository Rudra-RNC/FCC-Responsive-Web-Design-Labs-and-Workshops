<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HTML Audio and Video Lab</title>
</head>
<body>
  <h1>Not A Rick Roll</h1>
  <section>
    <h2>A Normal Genuine Video</h2>
    <video
      width="640"
      controls
      poster="https://images.unsplash.com/photo-1524492412937-b28074a5d7da"
      muted
      autoplay
    >
    <source src="never-gonna-give-you-up.mp4" type="video/mp4">"
    </video>
  </section>
  <section>
    <h2>Not Never Gonna Give You Up</h2>
    <audio controls loop src="https://cdn.freecodecamp.org/curriculum/js-music-player/we-are-going-to-make-it.mp3">
    </audio>
  </section>
</body>
</html>
